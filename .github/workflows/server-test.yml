name: Server Tests

on:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'packages/server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/server-test.yml'
jobs:
  test:
    name: Run Server Tests
    runs-on: ubuntu-latest
    environment: test-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        id: test
        run: |
          pnpm --filter server validate:runtimes | tee test-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "test_output<<EOF"
            cat test-output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $status
