name: Server Tests

on:
  pull_request:
    branches: ['main', 'develop']
    paths:
      - 'packages/server/**'
      - 'package.json'
jobs:
  test:
    name: Run Server Tests
    runs-on: ubuntu-latest
    environment: test-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        env:
          JWT_PRIVATE_KEY: ${{ vars.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ vars.JWT_PUBLIC_KEY }}
          JWT_DB_PRIVATE_KEY: ${{ vars.JWT_DB_PRIVATE_KEY }}
          JWT_ACCESS_EXPIRATION: ${{ vars.JWT_ACCESS_EXPIRATION }}
          JWT_DB_ACCESS_EXPIRATION: ${{ vars.JWT_DB_ACCESS_EXPIRATION }}
          REFRESH_SESSION_EXPIRATION: ${{ vars.REFRESH_SESSION_EXPIRATION }}
          SYNC_URL: ${{ vars.SYNC_URL }}
          ORIGIN_URLS: ${{ vars.ORIGIN_URLS }}
          DB_URL: ${{ vars.DB_URL }}
        id: test
        run: |
          pnpm --filter server test | tee test-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "test_output<<EOF"
            cat test-output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $status
